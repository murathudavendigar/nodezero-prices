name: Daily prices

on:
  schedule:
    # Once a day at 03:17 UTC (night in Europe, outside the busy hour marks).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      steam_max_pages:
        description: "Steam pages to fetch (100 items each); empty for all"
        required: false
        default: ""

permissions:
  contents: write
  # For "Keep the schedule alive" below.
  actions: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Get yesterday's file
        run: |
          mkdir -p out
          gh release download "$TAG" --pattern prices.json.gz --output out/previous.json.gz || echo "No earlier file"
          gh release download "$TAG" --pattern sales.json.gz --output out/previous-sales.json.gz || echo "No earlier sales file"
          gh release download "$TAG" --pattern rates.json.gz --output out/previous-rates.json.gz || echo "No earlier rates file"

      - name: Fetch prices
        env:
          STEAM_MAX_PAGES: ${{ inputs.steam_max_pages || '600' }}
        run: node scripts/fetch-prices.mjs

      - name: Publish
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Latest prices" --notes "Updated every day by the Daily prices workflow. Download: prices.json.gz (all prices), sales.json.gz (Skinport sales history), rates.json.gz (ECB dollar-to-euro rates) and meta.json (sources and dates)." --latest
          fi
          files="out/prices.json.gz out/sales.json.gz out/meta.json"
          if [ -f out/rates.json.gz ]; then files="$files out/rates.json.gz"; fi
          gh release upload "$TAG" $files --clobber
          cat out/meta.json >> "$GITHUB_STEP_SUMMARY"

      # GitHub turns off scheduled workflows in a repository with no commits for
      # 60 days, and this job never commits. Enabling the workflow again on every
      # run is how keepalive tools prevent that, without commits.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prices.yml/enable"
